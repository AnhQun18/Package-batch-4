[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfm-fe"
version = "0.1.0"
description = "Dataset-agnostic and model-agnostic RFM feature engineering package for transactional DataFrames."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["rfm_fe*"]
